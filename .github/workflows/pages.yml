name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python package
        run: python -m compileall -q src/mkmszr

      - name: Build browser-installable Python wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --wheel

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -R web/. _site/
          sed -i "s/v0\.DEV/v0.${GITHUB_RUN_NUMBER}/g" _site/index.html
          wheel_path="$(find dist -maxdepth 1 -type f -name 'mkmszr-*.whl' -print -quit)"
          test -n "$wheel_path"
          wheel_name="$(basename "$wheel_path")"
          cp "$wheel_path" "_site/$wheel_name"
          printf '%s\n' "$wheel_name" > _site/wheel-name.txt
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
