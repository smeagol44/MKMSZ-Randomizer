name: RMG host observer Flatpak (manual)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'diagnostics/rmg-host-observer/**'
      - '.github/workflows/rmg-host-observer.yml'

permissions:
  contents: read

jobs:
  build-observer:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder and tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3-yaml
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y flathub org.kde.Platform//6.11 org.kde.Sdk//6.11
      - name: Verify read-only memory observer (synthetic C)
        working-directory: diagnostics/rmg-host-observer
        run: python3 test_observer_memory_patch.py
      - name: Verify unread PCM write observer (synthetic only)
        working-directory: diagnostics/rmg-host-observer
        run: python3 test_observer_pcm_patch.py
      - name: Generate pinned side-by-side manifest
        working-directory: diagnostics/rmg-host-observer
        run: python3 generate_manifest.py
      - name: Build separately installed observer
        working-directory: diagnostics/rmg-host-observer
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --install-deps-from=flathub --repo=flatpak-repo flatpak-build \
            org.mkmszr.RMGPCMObserver.json
          flatpak build-bundle flatpak-repo RMG-PCM-Observer-v0.9.0.flatpak org.mkmszr.RMGPCMObserver
      - name: Verify runtime linker paths and observer payload
        working-directory: diagnostics/rmg-host-observer
        run: |
          test -f flatpak-build/files/lib/libRMG-Core.so
          test -f flatpak-build/files/bin/RMG
          test -f flatpak-build/files/lib/RMG/Core/libmupen64plus.so
          nm -D flatpak-build/files/lib/RMG/Core/libmupen64plus.so | grep ' MKMSZR_PCMBefore$'
          nm -D flatpak-build/files/lib/RMG/Core/libmupen64plus.so | grep ' MKMSZR_PCMAfter$'
          nm -D flatpak-build/files/lib/RMG/Core/libmupen64plus.so | grep ' MKMSZR_PCMTask$'
          readelf -d flatpak-build/files/bin/RMG | grep -E '(RPATH|RUNPATH)' | grep '/app/lib'
          find flatpak-build/files/lib/RMG -maxdepth 4 -type f | head -30
          test -s RMG-PCM-Observer-v0.9.0.flatpak
      - name: Archive for independent review (not runtime validated)
        uses: actions/upload-artifact@v4
        with:
          name: rmg-pcm-observer-v0.9.0-flatpak
          path: |
            diagnostics/rmg-host-observer/RMG-PCM-Observer-v0.9.0.flatpak
            diagnostics/rmg-host-observer/analyze_pcm_trace.py
            diagnostics/rmg-host-observer/decode_host_trace.py
            diagnostics/rmg-host-observer/prepare_pcm_capture.py
            diagnostics/rmg-host-observer/README-PCM.md
          retention-days: 14
