name: title-branch-source-bundle

on:
  workflow_dispatch:
  push:
    branches: ["feature/title-branding"]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: title-branch-source
          path: |
            src
            pyproject.toml
          if-no-files-found: error
